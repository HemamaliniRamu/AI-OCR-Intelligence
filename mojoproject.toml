[project]
name = "ai-ocr-intelligence"
version = "0.1.0"
description = "AI OCR Intelligence System using Tesseract, Mojo, Modular MAX, LangChain, and Streamlit"
readme = "README.md"
authors = ["Hema Malini"]
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["win-64", "linux-64"]

[dependencies]
max = ">=24.5.0"
python = ">=3.11"
pip = "*"

[tasks]
test-ocr = "python tests/test_ocr.py"
test-extractor = "python tests/test_extractor.py"
test-mojo = "mojo mojo_preprocess.mojo"
serve-max = "max serve --model modular/llama-3.1-8b-instruct --port 8000"
app = "streamlit run app.py"
